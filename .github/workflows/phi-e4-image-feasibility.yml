name: Phi E4 hermetic image namespace feasibility (non-certifying)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-user-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check rootless namespace operations inside pinned non-privileged base
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --user 1000:1000 \
            docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0 \
            /bin/sh -c 'command -v unshare; unshare --user --map-root-user --mount --pid --fork --mount-proc /usr/bin/true'

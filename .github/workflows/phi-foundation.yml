name: Phi portable foundation (not full Windows engine)
on:
  push:
  workflow_dispatch:
    inputs:
      integrated-certification-only:
        description: One-shot D6 certification of the exact immutable certified_sha; no diagnostic jobs
        type: boolean
        default: false
      certified_sha:
        description: Exact 40-character candidate commit for the integrated certification
        type: string
        default: ''
      ordinary-operation-focused:
        description: Focused ordinary Windows operation validation; not Campaign certification
        type: choice
        options: [none, modify, delete, rename]
        default: none
      windows-main-failure-diagnostic-only:
        description: One bounded non-certifying Windows-main failure-ledger diagnostic; no clone or Pi
        type: boolean
        default: false
      current-failure-focused-only:
        description: One bounded seven-ID Windows focus with fixed stage metadata; no clone or Pi
        type: boolean
        default: false
      current-failure-context-only:
        description: Bounded B/C intra-file predecessor diagnosis; no full corpus, clone or Pi
        type: boolean
        default: false
      current-failure-cross-context-only:
        description: One ordered seven-case cross-file context probe; no full corpus, clone or Pi
        type: boolean
        default: false
      lsp-diagnostic-only:
        description: Compare owned independent-clone LSP installation on runner temp volumes; no full gate
        type: boolean
        default: false
      clone-foundation-diagnostic-only:
        description: Reproduce only the owned independent-clone foundation suite with redacted TAP progress; no full gate
        type: boolean
        default: false
      clone-watchdog-focused-only:
        description: Prove native owned-job progress, stall and outer-ceiling semantics without a clone
        type: boolean
        default: false
      clone-test206-focused-only:
        description: Run only test 206 in an owned independent Windows clone; diagnostic, not certification
        type: boolean
        default: false
      corrupt-journal-ready-mode:
        description: Test 209 publisher readiness only; isolated or ordered prefix, never certification
        type: choice
        options: [none, isolated, ordered-prefix]
        default: none
      create-finalization-mode:
        description: Focused real Pi ordinary CREATE; isolated or three-smoke predecessor context, never certification
        type: choice
        options: [none, isolated, predecessor-context]
        default: none
      precreate-regression-only:
        description: Run the ordinary CREATE preflight regression block only; no Pi or CREATE
        type: boolean
        default: false
      two-writer-only:
        description: Run only the isolated two-writer receipt diagnostic; no Pi or CREATE
        type: boolean
        default: false
      d-wide-focused-only:
        description: Campaign-2 dependent four-task Windows production-path focus; not final D certification
        type: boolean
        default: false
      d-restart-focused-only:
        description: Campaign-2 D13 native V2 interrupted MODIFY and fresh-start recovery focus; not final certification
        type: boolean
        default: false
      campaign3-e1-focused:
        description: Campaign-3 E1 real offline autonomous source-repair focus; not E4 certification
        type: boolean
        default: false
      campaign3-e2-focused:
        description: Campaign-3 E2 real offline Worker host-write denial focus; not E4 certification
        type: boolean
        default: false
      campaign3-e3-focused:
        description: Campaign-3 E3 owned autonomous-root crash and V2 startup recovery focus; not E4 certification
        type: boolean
        default: false
      campaign3-e4-certification:
        description: One-shot Campaign-3 E4 exact-SHA Linux/Windows and E1/E2/E3 technical certification
        type: boolean
        default: false
      e4-host-feasibility-only:
        description: Non-certifying host Bubblewrap and pinned-rootfs isolation feasibility; no preflight or E4
        type: boolean
        default: false
      e4-image-qualification-only:
        description: Build and self-qualify the private immutable E4 image; no preflight or E4
        type: boolean
        default: false
      e4-rust-diagnostic-only:
        description: With image-only selected, run the one bounded Rust startup probe instead of qualification or publication
        type: boolean
        default: false
      e4-ubuntu-preflight-only:
        description: Ubuntu-only host-Bubblewrap preflight over the frozen qualified E4 image; no Windows or E4
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  e4-host-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs['e4-host-feasibility-only'] && !inputs['campaign3-e4-certification'] && !inputs['e4-image-qualification-only'] && !inputs['e4-ubuntu-preflight-only']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - name: Prove host Bubblewrap isolation over pinned representative rootfs
        run: bash scripts/e4-host-feasibility.sh docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
  e4-image-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs['e4-image-qualification-only'] && !inputs['e4-host-feasibility-only'] && !inputs['campaign3-e4-certification'] && !inputs['e4-ubuntu-preflight-only']
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Pin source and stage verified immutable tool seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools
          node scripts/e4-stage-seeds.mjs
          test -x "$RUNNER_TEMP/phi-e4-seeds/usr/bin/git"
      - name: Stage and check managed LSP from its pinned manifest
        run: |
          node scripts/install-managed-lsp.mjs --runtime "$RUNNER_TEMP/phi-e4-lsp"
          node scripts/install-managed-lsp.mjs --runtime "$RUNNER_TEMP/phi-e4-lsp" --check
      - name: Attest official LLVM 22.1.8 release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity=$(gh api repos/llvm/llvm-project/releases/tags/llvmorg-22.1.8 --jq '.assets[] | select(.name == "LLVM-22.1.8-Linux-X64.tar.xz") | [.id, .size, .digest] | @tsv')
          test "$identity" = $'449438700\t1938859476\tsha256:df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384'
          printf 'E4_LLVM_PROVENANCE=PASS tag=llvmorg-22.1.8 asset_id=449438700 archive_sha256=df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384\n'
      - name: Build minimal-context image and run isolated no-network Rust diagnostic or self-check
        env:
          E4_IMAGE_REF: ghcr.io/thetassotassista/tasso-pi-overdrive-e4:${{ github.sha }}
          E4_RUST_DIAGNOSTIC: ${{ inputs['e4-rust-diagnostic-only'] }}
        run: |
          docker buildx build --file certification/Dockerfile.e4 \
            --build-arg "PRODUCT_CANDIDATE_SHA=$GITHUB_SHA" \
            --build-context "seeds=$RUNNER_TEMP/phi-e4-seeds" \
            --build-context "lsp=$RUNNER_TEMP/phi-e4-lsp/managed" \
            --load --tag "$E4_IMAGE_REF" .
          test "$(docker image inspect "$E4_IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf 'E4_SEED_MANIFEST_SHA256=%s\n' "$(sha256sum config/e4-toolchain-seeds.json | awk '{print $1}')"
          printf 'E4_APPARMOR_PROFILE_SHA256=%s\n' "$(sha256sum certification/apparmor/phi-e4-bwrap.profile | awk '{print $1}')"
          if test "$E4_RUST_DIAGNOSTIC" = true; then
            docker run --rm --name "phi-e4-rust-diagnostic-$GITHUB_RUN_ID" --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 64 --memory 1g \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
              --user 1001:1001 --entrypoint /usr/bin/node "$E4_IMAGE_REF" /opt/phi/e4-rust-diagnostic.mjs
          else
            docker run --rm --name "phi-e4-image-selfcheck-$GITHUB_RUN_ID" --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 64 --memory 1g \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
              --user 1001:1001 "$E4_IMAGE_REF"
          fi
      - name: Publish only qualified image and record exact digest
        if: ${{ !inputs['e4-rust-diagnostic-only'] }}
        env:
          GH_TOKEN: ${{ github.token }}
          E4_IMAGE_REF: ghcr.io/thetassotassista/tasso-pi-overdrive-e4:${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$E4_IMAGE_REF"
          digest=$(docker image inspect "$E4_IMAGE_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -E '^ghcr.io/thetassotassista/tasso-pi-overdrive-e4@sha256:[a-f0-9]{64}$')
          test "$(printf '%s\n' "$digest" | wc -l)" -eq 1
          printf 'E4_CERTIFICATION_IMAGE_DIGEST=%s\n' "$digest"
          package=$(gh api 'user/packages/container/tasso-pi-overdrive-e4' --jq .visibility)
          test "$package" = private
          printf 'E4_IMAGE_PRIVATE=PASS\n'
      - name: Final image-job owned-container cleanup
        if: always()
        env:
          E4_IMAGE_REF: ghcr.io/thetassotassista/tasso-pi-overdrive-e4:${{ github.sha }}
        run: |
          docker info >/dev/null
          for container in "phi-e4-image-selfcheck-$GITHUB_RUN_ID" "phi-e4-rust-diagnostic-$GITHUB_RUN_ID"; do
            if docker container inspect "$container" >/dev/null 2>&1; then docker rm -f "$container" >/dev/null; fi
            test -z "$(docker ps -aq --filter "name=^/$container$")"
          done
          printf 'E4_IMAGE_RESIDUAL_OWNED_CONTAINERS=0\n'
          if docker image inspect "$E4_IMAGE_REF" >/dev/null 2>&1; then docker image rm "$E4_IMAGE_REF" >/dev/null; fi
          if docker image inspect "$E4_IMAGE_REF" >/dev/null 2>&1; then echo 'E4_IMAGE_LOCAL_TAG_STATE=FAIL' >&2; exit 1; fi
          printf 'E4_IMAGE_LOCAL_TAG_STATE=REMOVED\n'
          node scripts/e4-owned-image-cleanup.mjs
          printf 'E4_IMAGE_BUILD_TEMP_STATE=RUNNER_DOCKER_CACHE_UNSCOPED\n'
  e4-ubuntu-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs['e4-ubuntu-preflight-only'] && !inputs['campaign3-e4-certification'] && !inputs['e4-host-feasibility-only'] && !inputs['e4-image-qualification-only'] && !inputs['campaign3-e1-focused'] && !inputs['campaign3-e2-focused'] && !inputs['campaign3-e3-focused']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          ref: ${{ inputs.certified_sha }}
          path: product
          persist-credentials: false
      - name: Pin exact preflight source and product identities
        env:
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: |
          [[ "$CERTIFIED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C product rev-parse HEAD)" = "$CERTIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C product status --porcelain)"
      - name: Pull private frozen image with runner-only package credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Host isolation, exact toolchain, full Linux check and regression
        env:
          E4_GATE_KIND: preflight
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: bash scripts/e4-ubuntu-preflight.sh 'ghcr.io/thetassotassista/tasso-pi-overdrive-e4@sha256:8d45951a54903c8406c888331ee70e11cca3cdd4ef7c15ac6044761a6917e42a' "$CERTIFIED_SHA" "$GITHUB_WORKSPACE/product"
  integrated-ubuntu:
    if: github.event_name == 'workflow_dispatch' && inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only'] && !inputs['current-failure-focused-only'] && !inputs['current-failure-context-only'] && !inputs['current-failure-cross-context-only']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          ref: ${{ inputs.certified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Pin exact certification source
        env:
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: |
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Linux foundation bootstrap
        run: sh bootstrap/linux.sh
      - name: Complete Linux regression with exact corpus accounting
        run: node scripts/phi-owned-main-suite.mjs
      - name: Indexed source audit
        run: node scripts/phi-repository-audit.mjs
  integrated-windows:
    if: github.event_name == 'workflow_dispatch' && inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only'] && !inputs['current-failure-focused-only'] && !inputs['current-failure-context-only'] && !inputs['current-failure-cross-context-only']
    needs: integrated-ubuntu
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          ref: ${{ inputs.certified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Pin exact certification source
        shell: pwsh
        env:
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: |
          if ($env:CERTIFIED_SHA -notmatch '^[0-9a-f]{40}$') { exit 1 }
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { exit 1 }
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Complete Windows main suite inside existing owned Job
        run: node scripts/phi-owned-main-suite.mjs
      - name: Post-main fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Independent clean-room Git clone and LSP under existing limits
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs
      - name: Post-clone fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Install isolated pinned Pi and subagents (no auth or lifecycle scripts)
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          exit $LASTEXITCODE
      - name: Three deterministic real Pi smokes in required order
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --revocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --lsp
          exit $LASTEXITCODE
      - name: Post-smoke fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow CREATE V6 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Post-CREATE fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow MODIFY V2 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --modify
          exit $LASTEXITCODE
      - name: Post-MODIFY fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow DELETE V3 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --delete
          exit $LASTEXITCODE
      - name: Post-DELETE fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow RENAME V4 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --rename
          exit $LASTEXITCODE
      - name: Post-RENAME fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: D-wide four dependent normal workflows on one logical disposable Git project
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-d-wide-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Post-D-wide fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: D-wide CREATE prefix and interrupted V2 MODIFY fresh-start recovery
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-d-wide-pi-smoke.mjs --restart-v2
          exit $LASTEXITCODE
      - name: Post-D-restart fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  windows-main-failure-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['windows-main-failure-diagnostic-only'] && !inputs['integrated-certification-only']
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: One non-certifying owned Windows main corpus with bounded failure ledger
        run: node scripts/phi-owned-main-suite.mjs
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  current-failure-focused:
    if: github.event_name == 'workflow_dispatch' && (inputs['current-failure-focused-only'] || inputs['current-failure-context-only'] || inputs['current-failure-cross-context-only']) && !inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only']
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for selected native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Exact seven-ID focus or bounded context under unchanged owned 120-second limit
        run: node scripts/phi-current-failures-focused.mjs ${{ inputs['current-failure-cross-context-only'] && '--cross-context' || (inputs['current-failure-context-only'] && '--context' || '') }}
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  ordinary-create-finalization-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs['create-finalization-mode'] == 'isolated' || inputs['create-finalization-mode'] == 'predecessor-context' || inputs['precreate-regression-only'] || inputs['two-writer-only'])
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell

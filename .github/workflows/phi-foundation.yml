name: Phi portable foundation (not full Windows engine)
on:
  push:
  workflow_dispatch:
    inputs:
      lsp-diagnostic-only:
        description: Compare owned independent-clone LSP installation on runner temp volumes; no full gate
        type: boolean
        default: false
      clone-foundation-diagnostic-only:
        description: Reproduce only the owned independent-clone foundation suite with redacted TAP progress; no full gate
        type: boolean
        default: false
      clone-watchdog-focused-only:
        description: Prove native owned-job progress, stall and outer-ceiling semantics without a clone
        type: boolean
        default: false
      clone-test206-focused-only:
        description: Run only test 206 in an owned independent Windows clone; diagnostic, not certification
        type: boolean
        default: false
      corrupt-journal-ready-mode:
        description: Test 209 publisher readiness only; isolated or ordered prefix, never certification
        type: choice
        options: [none, isolated, ordered-prefix]
        default: none
      create-finalization-mode:
        description: Focused real Pi ordinary CREATE; isolated or three-smoke predecessor context, never certification
        type: choice
        options: [none, isolated, predecessor-context]
        default: none
permissions:
  contents: read
jobs:
  ordinary-create-finalization-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs['create-finalization-mode'] == 'isolated' || inputs['create-finalization-mode'] == 'predecessor-context')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Install isolated pinned Pi and subagents (no auth or lifecycle scripts)
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three predecessor Pi smokes (Run 2 context only)
        if: inputs['create-finalization-mode'] == 'predecessor-context'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --revocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --lsp
          exit $LASTEXITCODE
      - name: Focused genuine ordinary CREATE with pre-cleanup metadata snapshot
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs
          exit $LASTEXITCODE
  corrupt-journal-ready-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs['corrupt-journal-ready-mode'] == 'isolated' || inputs['corrupt-journal-ready-mode'] == 'ordered-prefix')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install existing pinned LSP runtime for ordered-prefix context
        if: inputs['corrupt-journal-ready-mode'] == 'ordered-prefix'
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Native test 209 readiness diagnosis only; no clone, Pi or CREATE
        env:
          PHI_READY_DIAGNOSTIC_MODE: ${{ inputs['corrupt-journal-ready-mode'] }}
        run: node scripts/phi-ready-diagnostic.mjs
  clone-test206-focused:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Owned independent-clone test 206 only; metadata-only diagnostic, never certification
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs --test206-diagnostic-only
  clone-watchdog-focused:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Focused reporter, completeness, liveness and owned cleanup controls
        run: node --test tests/clone-runtime-reporter.test.mjs tests/clone-runtime-gate.test.mjs
  clone-foundation-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Owned independent-clone full-corpus runtime diagnostic, never certification
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs --runtime-diagnostic-only
  lsp-clone-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['lsp-diagnostic-only'] && !inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: C-volume owned clone install (first control)
        id: c1
        continue-on-error: true
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: D-volume owned clone install (runner temporary volume)
        id: d
        continue-on-error: true
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: C-volume owned clone install (order control, not a gate retry)
        id: c2
        continue-on-error: true
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: Report every controlled trial honestly
        if: always()
        shell: pwsh
        run: |
          Write-Output 'C1=${{ steps.c1.outcome }} D=${{ steps.d.outcome }} C2=${{ steps.c2.outcome }}'
          if ('${{ steps.c1.outcome }}' -ne 'success' -or '${{ steps.d.outcome }}' -ne 'success' -or '${{ steps.c2.outcome }}' -ne 'success') { exit 1 }
  native-foundation:
    if: github.event_name != 'workflow_dispatch' || (!inputs['lsp-diagnostic-only'] && !inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only'] && inputs['corrupt-journal-ready-mode'] != 'isolated' && inputs['corrupt-journal-ready-mode'] != 'ordered-prefix' && inputs['create-finalization-mode'] != 'isolated' && inputs['create-finalization-mode'] != 'predecessor-context')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # CI36647998566 passed Windows suites and clone but hit the 25m job ceiling
    # before the three Pi smokes. Only Windows CI gets the authorized 40m cap;
    # Ubuntu remains 25m. LSP, tool, production and agent limits are unchanged.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 25 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (no peers, no lifecycle scripts)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Bootstrap zero-write plan
        run: node bootstrap/core.mjs --plan
      - name: Native Windows foundation bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner (not a sandbox)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Native Linux foundation bootstrap
        if: runner.os == 'Linux'
        run: sh bootstrap/linux.sh
      - name: Native Windows no-clobber CREATE primitive (not project publication)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="native no-clobber" tests/phi-publication.test.mjs
      - name: Native Windows durable publication journal and real writer death (not project publication)
        if: runner.os == 'Windows'
        run: node --test tests/phi-publication-journal.test.mjs
      - name: Native Windows atomic MODIFY primitive (NTFS transaction, not production publication)
        if: runner.os == 'Windows'
        run: node --test tests/phi-atomic-modify.test.mjs
      - name: Native Windows journal-bound MODIFY and real publisher death (not Worker publication)
        if: runner.os == 'Windows'
        run: node --test tests/phi-journal-modify.test.mjs
      - name: Native Windows journal-bound DELETE quarantine and restarted recovery (no TxF, no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-journal-delete.test.mjs
      - name: Native Windows terminal journal retention at actual 64-entry capacity (no model calls)
        if: runner.os == 'Windows'
        run: node tests/phi-retention-capacity.mjs
      - name: Native Windows process crash between reclamation and PREPARED (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-retention-admission-crash.test.mjs
      - name: Native Windows expected-ID no-clobber RENAME primitive (not journal/publication, no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-rename-primitive.test.mjs
      - name: Native Windows explicit same-directory RENAME journal and restarted observation (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-journal-rename.test.mjs
      - name: Native Windows clean-clone primary/cleanup and ownership controls (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-clone-cleanup.test.mjs
      - name: Install existing pinned LSP runtime for native same-draft diagnostics
        if: runner.os == 'Windows'
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Real Windows LSP via governed draft and LPAC broker (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-windows-lsp.test.mjs
      - name: Real verified Worker single-file publication and final concurrency (no model calls, autonomy blocked)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="native production Worker|native user change after READY" tests/phi-publication.test.mjs
      - name: Native Windows structured broker fixtures (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-windows-broker.test.mjs
      - name: Native Windows production safe_exec and verification (no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-windows-coding-tools.test.mjs
      - name: Native Windows governed Worker transport (no model calls, autonomy blocked)
        if: runner.os == 'Windows'
        run: node --test tests/phi-worker-transport.test.mjs
      - name: Native Windows recovery individually and sequentially (no model calls)
        if: runner.os == 'Windows'
        run: node scripts/phi-windows-recovery-focus.mjs
      - name: Normal Phi startup recovery after real publisher death (autonomy remains blocked; no model calls)
        if: runner.os == 'Windows'
        run: node --test tests/phi-startup-recovery.test.mjs
      - name: Mixed journal per-operation durability after real publisher death (journal only; no publication)
        if: runner.os == 'Windows'
        run: node --test tests/phi-mixed-journal.test.mjs
      - name: Native platform, filesystem, themes, CLI, backup policy and bootstrap tests
        run: npm run check:phi
      - name: Non-interactive brand smoke (no model calls)
        run: node bin/phi.mjs splash --theme aurora
      - name: Indexed source/artifact/path/secret audit (no raw matches)
        run: node scripts/phi-repository-audit.mjs
      - name: Clean Git-source clone (foundation only, engine must be unavailable)
        if: runner.os != 'Windows'
        run: node scripts/phi-clean-room.mjs
      - name: Clean Git-source clone on runner temporary volume (foundation only)
        if: runner.os == 'Windows'
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs
      - name: Isolated pinned Pi runtime for real Worker session proof (no auth, no lifecycle scripts)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Pi foreground Worker factory to native LPAC broker (zero external provider calls)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Real Pi revoked Worker denies built-in host write (zero external provider calls)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs --revocation
          exit $LASTEXITCODE
      - name: Real Pi Worker edit to same-draft LSP on-write and semantic_nav (zero external provider calls)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs --lsp
          exit $LASTEXITCODE
      - name: Normal secure_coding_workflow bounded CREATE through real Pi and V6 (zero external provider calls)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Scope reminder
        run: node -e "console.log('FOUNDATION ONLY. Windows autonomous engine remains BLOCKED; no live auth or sandbox parity claimed. Full Linux regression is a separate mandatory gate.')"

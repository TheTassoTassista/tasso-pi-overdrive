        run: sh bootstrap/linux.sh
      - name: Native Windows no-clobber CREATE primitive (not project publication)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="native no-clobber" tests/phi-publication.test.mjs
      - name: Native Windows durable publication journal and real writer death (not project publication)

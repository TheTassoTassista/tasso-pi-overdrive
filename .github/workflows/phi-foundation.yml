name: Phi portable foundation (not full Windows engine)
on:
  push:
  workflow_dispatch:
    inputs:
      integrated-certification-only:
        description: One-shot D6 certification of the exact immutable certified_sha; no diagnostic jobs
        type: boolean
        default: false
      certified_sha:
        description: Exact 40-character candidate commit for the integrated certification
        type: string
        default: ''
      ordinary-operation-focused:
        description: Focused ordinary Windows operation validation; not Campaign certification
        type: choice
        options: [none, modify, delete, rename]
        default: none
      windows-main-failure-diagnostic-only:
        description: One bounded non-certifying Windows-main failure-ledger diagnostic; no clone or Pi
        type: boolean
        default: false
      current-failure-focused-only:
        description: One bounded seven-ID Windows focus with fixed stage metadata; no clone or Pi
        type: boolean
        default: false
      current-failure-context-only:
        description: Bounded B/C intra-file predecessor diagnosis; no full corpus, clone or Pi
        type: boolean
        default: false
      lsp-diagnostic-only:
        description: Compare owned independent-clone LSP installation on runner temp volumes; no full gate
        type: boolean
        default: false
      clone-foundation-diagnostic-only:
        description: Reproduce only the owned independent-clone foundation suite with redacted TAP progress; no full gate
        type: boolean
        default: false
      clone-watchdog-focused-only:
        description: Prove native owned-job progress, stall and outer-ceiling semantics without a clone
        type: boolean
        default: false
      clone-test206-focused-only:
        description: Run only test 206 in an owned independent Windows clone; diagnostic, not certification
        type: boolean
        default: false
      corrupt-journal-ready-mode:
        description: Test 209 publisher readiness only; isolated or ordered prefix, never certification
        type: choice
        options: [none, isolated, ordered-prefix]
        default: none
      create-finalization-mode:
        description: Focused real Pi ordinary CREATE; isolated or three-smoke predecessor context, never certification
        type: choice
        options: [none, isolated, predecessor-context]
        default: none
      precreate-regression-only:
        description: Run the ordinary CREATE preflight regression block only; no Pi or CREATE
        type: boolean
        default: false
      two-writer-only:
        description: Run only the isolated two-writer receipt diagnostic; no Pi or CREATE
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  integrated-ubuntu:
    if: github.event_name == 'workflow_dispatch' && inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only'] && !inputs['current-failure-focused-only'] && !inputs['current-failure-context-only']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          ref: ${{ inputs.certified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Pin exact certification source
        env:
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: |
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Linux foundation bootstrap
        run: sh bootstrap/linux.sh
      - name: Complete Linux regression with exact corpus accounting
        run: node scripts/phi-owned-main-suite.mjs
      - name: Indexed source audit
        run: node scripts/phi-repository-audit.mjs
  integrated-windows:
    if: github.event_name == 'workflow_dispatch' && inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only'] && !inputs['current-failure-focused-only'] && !inputs['current-failure-context-only']
    needs: integrated-ubuntu
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          ref: ${{ inputs.certified_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Pin exact certification source
        shell: pwsh
        env:
          CERTIFIED_SHA: ${{ inputs.certified_sha }}
        run: |
          if ($env:CERTIFIED_SHA -notmatch '^[0-9a-f]{40}$') { exit 1 }
          if ((git rev-parse HEAD).Trim() -ne $env:CERTIFIED_SHA) { exit 1 }
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Complete Windows main suite inside existing owned Job
        run: node scripts/phi-owned-main-suite.mjs
      - name: Post-main fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Independent clean-room Git clone and LSP under existing limits
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs
      - name: Post-clone fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Install isolated pinned Pi and subagents (no auth or lifecycle scripts)
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          exit $LASTEXITCODE
      - name: Three deterministic real Pi smokes in required order
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --revocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --lsp
          exit $LASTEXITCODE
      - name: Post-smoke fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow CREATE V6 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Post-CREATE fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow MODIFY V2 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --modify
          exit $LASTEXITCODE
      - name: Post-MODIFY fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow DELETE V3 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --delete
          exit $LASTEXITCODE
      - name: Post-DELETE fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Ordinary Pi secure workflow RENAME V4 and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --rename
          exit $LASTEXITCODE
      - name: Post-RENAME fixed-scope ownership baseline
        run: node scripts/phi-owned-scope-baseline.mjs
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  windows-main-failure-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['windows-main-failure-diagnostic-only'] && !inputs['integrated-certification-only']
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: One non-certifying owned Windows main corpus with bounded failure ledger
        run: node scripts/phi-owned-main-suite.mjs
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  current-failure-focused:
    if: github.event_name == 'workflow_dispatch' && (inputs['current-failure-focused-only'] || inputs['current-failure-context-only']) && !inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only']
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime for selected native tests
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Exact seven-ID focus or B/C file context under unchanged owned 120-second limit
        run: node scripts/phi-current-failures-focused.mjs ${{ inputs['current-failure-context-only'] && '--context' || '' }}
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  ordinary-create-finalization-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs['create-finalization-mode'] == 'isolated' || inputs['create-finalization-mode'] == 'predecessor-context' || inputs['precreate-regression-only'] || inputs['two-writer-only'])
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Focused process identity and protected workflow evidence regression
        if: inputs['precreate-regression-only']
        run: node --test tests/process-identity.test.mjs tests/protected-artifact.test.mjs tests/workflow-evidence.test.mjs tests/receipt-protocol.test.mjs tests/runtime-isolation.test.mjs
      - name: Isolated concurrent receipt writer diagnostic
        if: inputs['two-writer-only']
        run: node --test --test-name-pattern="two process writers produce a deterministic sorted receipt ledger" tests/receipt-protocol.test.mjs
      - name: Install pinned LSP runtime
        if: ${{ !inputs['precreate-regression-only'] && !inputs['two-writer-only'] }}
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Focused CREATE process-graph reason regression
        if: ${{ !inputs['precreate-regression-only'] && !inputs['two-writer-only'] }}
        run: node --test tests/integrated-certification-evidence.test.mjs
      - name: Install isolated pinned Pi and subagents (no auth or lifecycle scripts)
        if: ${{ !inputs['precreate-regression-only'] && !inputs['two-writer-only'] }}
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Three predecessor Pi smokes (Run 2 context only)
        if: inputs['create-finalization-mode'] == 'predecessor-context'
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-worker-pi-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --revocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/phi-worker-pi-smoke.mjs --lsp
          exit $LASTEXITCODE
      - name: Focused genuine ordinary CREATE with pre-cleanup metadata snapshot
        if: ${{ !inputs['precreate-regression-only'] && !inputs['two-writer-only'] }}
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs
          exit $LASTEXITCODE
      - name: Focused final fixed-scope ownership baseline even after CREATE failure
        if: ${{ always() && (inputs['create-finalization-mode'] == 'isolated' || inputs['create-finalization-mode'] == 'predecessor-context') }}
        run: node scripts/phi-owned-scope-baseline.mjs
  ordinary-operation-focused:
    if: github.event_name == 'workflow_dispatch' && (inputs['ordinary-operation-focused'] == 'modify' || inputs['ordinary-operation-focused'] == 'delete' || inputs['ordinary-operation-focused'] == 'rename')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install pinned LSP runtime
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Focused bounded ordinary operation grant and conflict regressions
        shell: pwsh
        run: |
          $operation = '${{ inputs['ordinary-operation-focused'] }}'.ToUpperInvariant()
          node --test "--test-name-pattern=native bounded ordinary $operation" tests/phi-publication.test.mjs
          exit $LASTEXITCODE
      - name: Install isolated pinned Pi and subagents
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          npm install --prefix $workerTestPrefix --ignore-scripts --legacy-peer-deps --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1 pi-subagents@0.66.0
          exit $LASTEXITCODE
      - name: Genuine ordinary Pi operation and protected receipt readback
        shell: pwsh
        run: |
          $workerTestPrefix = Join-Path $env:RUNNER_TEMP 'phi-worker-pi-runtime'
          $env:PHI_WORKER_TEST_PI_ROOT = Join-Path $workerTestPrefix 'node_modules/@earendil-works/pi-coding-agent'
          $env:PHI_WORKER_TEST_SUBAGENT_ROOT = Join-Path $workerTestPrefix 'node_modules/pi-subagents'
          node scripts/phi-bounded-workflow-pi-smoke.mjs --${{ inputs['ordinary-operation-focused'] }}
          exit $LASTEXITCODE
      - name: Final fixed-scope ownership baseline even after failure
        if: always()
        run: node scripts/phi-owned-scope-baseline.mjs
  corrupt-journal-ready-diagnostic:
    if: github.event_name == 'workflow_dispatch' && (inputs['corrupt-journal-ready-mode'] == 'isolated' || inputs['corrupt-journal-ready-mode'] == 'ordered-prefix')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Native Windows foundation bootstrap
        shell: pwsh
        run: ./bootstrap/windows.ps1
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Install existing pinned LSP runtime for ordered-prefix context
        if: inputs['corrupt-journal-ready-mode'] == 'ordered-prefix'
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Native test 209 readiness diagnosis only; no clone, Pi or CREATE
        env:
          PHI_READY_DIAGNOSTIC_MODE: ${{ inputs['corrupt-journal-ready-mode'] }}
        run: node scripts/phi-ready-diagnostic.mjs
  clone-test206-focused:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Owned independent-clone test 206 only; metadata-only diagnostic, never certification
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs --test206-diagnostic-only
  clone-watchdog-focused:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Focused reporter, completeness, liveness and owned cleanup controls
        run: node --test tests/clone-runtime-reporter.test.mjs tests/clone-runtime-gate.test.mjs
  clone-foundation-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: Owned independent-clone full-corpus runtime diagnostic, never certification
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-clean-room.mjs --runtime-diagnostic-only
  lsp-clone-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs['lsp-diagnostic-only'] && !inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only']
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22.23.2'
      - name: Install source-only dependencies (same clone precondition)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Build existing trusted native Windows process owner
        shell: powershell
        run: ./scripts/build-windows-process.ps1
      - name: Warm the same pinned LSP package cache as the full gate
        run: npm ci --prefix runtime/lsp --ignore-scripts --no-audit --no-fund
      - name: C-volume owned clone install (first control)
        id: c1
        continue-on-error: true
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: D-volume owned clone install (runner temporary volume)
        id: d
        continue-on-error: true
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: C-volume owned clone install (order control, not a gate retry)
        id: c2
        continue-on-error: true
        run: node scripts/phi-lsp-clone-diagnostic.mjs
      - name: Report every controlled trial honestly
        if: always()
        shell: pwsh
        run: |
          Write-Output 'C1=${{ steps.c1.outcome }} D=${{ steps.d.outcome }} C2=${{ steps.c2.outcome }}'
          if ('${{ steps.c1.outcome }}' -ne 'success' -or '${{ steps.d.outcome }}' -ne 'success' -or '${{ steps.c2.outcome }}' -ne 'success') { exit 1 }
  native-foundation:
    if: github.event_name != 'workflow_dispatch' || (!inputs['integrated-certification-only'] && !inputs['windows-main-failure-diagnostic-only'] && !inputs['current-failure-focused-only'] && !inputs['current-failure-context-only'] && inputs['ordinary-operation-focused'] == 'none' && !inputs['lsp-diagnostic-only'] && !inputs['clone-foundation-diagnostic-only'] && !inputs['clone-watchdog-focused-only'] && !inputs['clone-test206-focused-only'] && inputs['corrupt-journal-ready-mode'] != 'isolated' && inputs['corrupt-journal-ready-mode'] != 'ordered-prefix' && inputs['create-finalization-mode'] != 'isolated' && inputs['create-finalization-mode'] != 'predecessor-context' && !inputs['precreate-regression-only'] && !inputs['two-writer-only'])
